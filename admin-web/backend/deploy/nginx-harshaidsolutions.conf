# Public site only. Do not add myschoolidcard.in to this file.
# Admin stays on its existing Nginx site.
#
# If Certbot already added "listen 443 ssl" and ssl_certificate lines on the
# live server, keep those lines. Add the location blocks below to that same
# server. Do not replace the live HTTPS server with a port-80-only file.

server {
    listen 80;
    listen [::]:80;
    server_name harshaidsolutions.in www.harshaidsolutions.in;

    root /var/www/harshaidsolutions;
    index index.html;

    location = /index.html { return 301 /; }
    location = /about.html { return 301 /about-us; }
    location = /contact.html { return 301 /contact-us; }
    location = /gallery.html { return 301 /gallery; }
    location = /get-in-touch.html { return 301 /get-in-touch; }
    location = /my-app.html { return 301 /my-app; }
    location = /videos.html { return 301 /videos; }
    location = /buy-now.html { return 301 /buy-now; }

    location = /about-us { rewrite ^ /about.html break; }
    location = /contact-us { rewrite ^ /contact.html break; }
    location = /gallery { rewrite ^ /gallery.html break; }
    location = /get-in-touch { rewrite ^ /get-in-touch.html break; }
    location = /my-app { rewrite ^ /my-app.html break; }
    location = /videos { rewrite ^ /videos.html break; }
    location = /buy-now { rewrite ^ /buy-now.html break; }

    location / {
        try_files $uri $uri/ =404;
    }
}
