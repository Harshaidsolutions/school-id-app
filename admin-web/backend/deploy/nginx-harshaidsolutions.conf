# Public site only. Do not add myschoolidcard.in to this file.
# Admin stays on its existing Nginx site.

server {
    listen 80;
    listen [::]:80;
    server_name harshaidsolutions.in www.harshaidsolutions.in;

    root /var/www/harshaidsolutions;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
