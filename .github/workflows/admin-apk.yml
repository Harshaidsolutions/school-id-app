name: Build Admin APK

# Test build of the admin Android app (all admin screens inside the APK). The Play Store file is built on the Mac.
# Run it: GitHub → Actions → "Build Admin APK" → Run workflow. Download the APK under Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["admin-app/**", "admin-web/src/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build admin screens
        working-directory: admin-web
        run: |
          npm install --include=dev --no-audit --no-fund
          npx vite build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Build APK (test signing)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MySchoolIDCard-Admin-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MySchoolIDCard-Admin-APK
          path: admin-app/MySchoolIDCard-Admin-test.apk
          if-no-files-found: error
