name: Build Windows ID Card Generator

# Builds the .exe and .msi on GitHub's Windows computers — no Windows PC needed.
# Run it: GitHub → Actions → "Build Windows ID Card Generator" → Run workflow.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop-generator/**", "admin-web/src/generator/**"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get licence public key from the server
        shell: pwsh
        run: |
          $pem = (Invoke-WebRequest -UseBasicParsing "https://myschoolidcard.in/api/public/desktop-license/public-key").Content
          if ($pem -is [byte[]]) { $pem = [System.Text.Encoding]::UTF8.GetString($pem) }
          if ($pem -notmatch "BEGIN PUBLIC KEY") { throw "Server did not return a public key. Is DESKTOP_LICENSE_PRIVATE_KEY set in backend/.env and the backend restarted?" }
          Set-Content -Path electron/publicKey.cjs -Value ("module.exports = ``" + $pem.Trim() + "`n``;") -Encoding utf8
          Get-Content electron/publicKey.cjs
      - run: npm install
      - name: Build .exe installer
        run: npm run dist:exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build .msi installer (optional)
        continue-on-error: true
        run: npm run dist:msi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: MySchoolIDCard-Generator-Windows
          path: |
            desktop-generator/release/*.exe
            desktop-generator/release/*.msi
          if-no-files-found: warn
      - name: Read app version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish downloadable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: generator-v${{ steps.ver.outputs.v }}
          name: ID Card Generator v${{ steps.ver.outputs.v }}
          body: |
            Harsha ID Solutions - ID Card Generator for Windows.
            Download the .exe (recommended) or .msi below and install it on a Windows PC,
            then activate it with the customer's licence key.
          files: |
            desktop-generator/release/*.exe
            desktop-generator/release/*.msi
          fail_on_unmatched_files: false
