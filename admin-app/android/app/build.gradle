plugins { id 'com.android.application' }

// Standalone native Admin app: a full-screen WebView of https://myschoolidcard.in
// (no Chrome bar, no Trusted Web Activity / assetlinks setup needed).
android {
    namespace 'com.schoolid.admin'
    compileSdk 36
    defaultConfig {
        applicationId 'com.schoolid.admin'
        minSdk 21
        targetSdk 36
        versionCode 4
        versionName '2.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('ADMIN_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ADMIN_KEYSTORE_PASSWORD')
                keyAlias 'school-id-admin'
                keyPassword System.getenv('ADMIN_KEYSTORE_PASSWORD')
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
// ── All admin screens are packed inside the APK ──
// scripts/build-release-macos.sh builds admin-web first (admin-web/dist), then this copies it into assets/web.
def adminWebDist = new File(rootDir, '../../admin-web/dist').canonicalFile
def bundledAssetsDir = new File(buildDir, 'generated/adminweb')
def copyAdminScreens = tasks.register('copyAdminScreens', Sync) {
    from(adminWebDist) { exclude 'sw.js' }
    into(new File(bundledAssetsDir, 'web'))
}
android.sourceSets.main.assets.srcDir(bundledAssetsDir)
tasks.named('preBuild') {
    dependsOn copyAdminScreens
    doFirst {
        if (!new File(bundledAssetsDir, 'web/index.html').exists()) {
            throw new GradleException('Admin screens not built. Run admin-app/scripts/build-release-macos.sh (it builds admin-web first).')
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'validateSigningRelease') {
        task.doFirst {
            if (!System.getenv('ADMIN_KEYSTORE_PATH') || !System.getenv('ADMIN_KEYSTORE_PASSWORD')) {
                throw new GradleException('Run admin-app/scripts/build-release-macos.sh to build the signed Admin APK.')
            }
        }
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
