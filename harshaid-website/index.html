<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home | Harsha ID Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="/assets/images/harsha-official-logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/images/harsha-official-logo.png" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body data-page="home">
  <div data-header></div>
  <main id="main">
    <section class="hero" aria-label="Harsha ID Solutions">
      <div class="wrap hanger">
        <div class="pin" aria-hidden="true"></div>
        <div class="swing">
          <div class="rope" aria-hidden="true"></div>
          <img src="/assets/images/harsha-official-logo.png" alt="Harsha ID Solutions, A Complete ID World" />
        </div>
      </div>
    </section>

    <section class="section soft">
      <div class="wrap">
        <h2 class="center">OUR PRODUCTS</h2>
        <div class="product-grid" data-products></div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <h2 class="center">OUR BEST CLIENTS</h2>
        <div class="client-grid" data-clients></div>
      </div>
    </section>

    <section class="section soft">
      <div class="wrap">
        <h2 class="center">OUR EXPERIENCE</h2>
        <div class="stat-grid">
          <article class="stat-card"><b>2016</b><span>EST.</span></article>
          <article class="stat-card"><b>1000+</b><span>Schools Served</span></article>
          <article class="stat-card"><b>10L+</b><span>IDs Created</span></article>
          <article class="stat-card"><b>3</b><span>Districts Covered</span></article>
        </div>
      </div>
    </section>
  </main>
  <div data-footer></div>
  <script src="/assets/js/site-content.js"></script>
  <script src="/assets/js/site.js"></script>
</body>
</html>
