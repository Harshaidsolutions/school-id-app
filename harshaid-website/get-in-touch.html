<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get in Touch | Harsha ID Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="touch">
  <div data-header></div>
  <main id="main" class="section">
    <div class="wrap">
      <h1>Get in Touch</h1>
      <form class="form" id="enquiryForm">
        <label>Name
          <input name="name" required maxlength="80" autocomplete="name" />
        </label>
        <label>Phone
          <input name="phone" required maxlength="20" autocomplete="tel" inputmode="tel" />
        </label>
        <label>Email
          <input name="email" type="email" required maxlength="120" autocomplete="email" />
        </label>
        <label>Message
          <textarea name="message" rows="6" required maxlength="2000"></textarea>
        </label>
        <button class="btn" type="submit">Send Message</button>
        <p class="toast" id="formToast" hidden></p>
      </form>
    </div>
  </main>
  <div data-footer></div>
  <script src="assets/js/site-content.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
